name = "signalbridge-hackutd-2026"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]
main = "worker.ts"

[assets]
directory = "dist"
binding = "ASSETS"
