name = "pharos-hackutd-2026"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]
main = "worker.ts"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/pharos-demo.mp4", "/api/*", "/_deepspace/*", "/llms.txt", "/llms-full.txt", "/.well-known/mcp", "/.well-known/mcp.json", "/.well-known/mcp/*"]

[[durable_objects.bindings]]
name = "PHAROS_STORE"
class_name = "PharosStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PharosStore"]

[vars]
DEEPSPACE_APP_ID = "app_01M6W882E96HE85E815QZECT7X"
APP_NAME = "pharos-hackutd-2026"
PHAROS_TRANSCRIPT_RETENTION_HOURS = "24"

[dev]
port = 8780
inspector_port = 9237
