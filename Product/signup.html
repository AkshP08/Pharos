<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Pharos</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f6f3;color:#183d38;font:16px system-ui}main{box-sizing:border-box;background:white;padding:32px;border-radius:18px;width:min(440px,92vw);box-shadow:0 12px 50px #123d3c15}label,input,button{display:block;box-sizing:border-box;width:100%}label{margin-top:18px}input,button{padding:12px;margin-top:8px;border:1px solid #c9d7d0;border-radius:7px;font:inherit}button{background:#17534d;color:white;margin-top:24px;cursor:pointer}a{color:#17534d}#signupError{color:#9d2929}h1{font-size:28px}</style></head><body><main><a href="/">← Pharos</a><h1>Create your responder account</h1><p>Join the shared Pharos demo workspace. New accounts have immediate demo access.</p><form id="signupForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" required><button id="createButton" type="submit">Create account</button><p id="signupError" role="status" aria-live="polite"></p></form><p>Already registered? <a href="/">Sign in</a></p></main><script src="/signup.js"></script></body></html>
