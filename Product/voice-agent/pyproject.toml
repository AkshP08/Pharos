[project]
name = "pharos-voice-agent"
version = "0.1.0"
description = "Photon SIP inbound-call agent for Pharos disaster intake"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "livekit-agents~=1.8.11",
  "python-dotenv>=1.0,<2",
  "truststore>=0.10,<1",
]

[project.scripts]
pharos-agent = "agent:main"

[tool.uv]
package = false
